<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="container-column">
                <h3 class="almost-white score-title">HOME</h3>
                <h4 id="home-score" class="score-style">0</h4>
                <div class="score-button-container">
                    <button id="home-score-plusone-btn" class="score-button" onclick="addOnePointHome()">+1</button>
                    <button id="home-score-plustwo-btn" class="score-button" onclick="addTwoPointHome()">+2</button>
                    <button id="home-score-plusthree-btn" class="score-button" onclick="addThreePointHome()">+3</button>
                </div>
                <div class="fouls-container">
                    <h5 id="home-fouls" class="foul-h5 almost-white">FOULS:</h5>
                    <button id="home-fouls-btn" class="score-button" onclick="addFoulsHome()">+1</button>
                </div>
            </div>
            <div class="container-column">
                <h3 class="almost-white score-title">AWAY</h3>
                <h4 id="guest-score" class="score-style">0</h4>
                <div class="score-button-container">
                    <button id="guest-score-plusone-btn" class="score-button" onclick="addOnePointGuest()">+1</button>
                    <button id="guest-score-plustwo-btn" class="score-button" onclick="addTwoPointGuest()">+2</button>
                    <button id="guest-score-plusthree-btn" class="score-button" onclick="addThreePointGuest()">+3</button>
                </div>
                <div class="fouls-container">
                    <h5 id="guest-fouls" class="foul-h5 almost-white">FOULS:</h5>
                    <button id="guest-fouls-btn" class="score-button" onclick="addFoulsGuest()">+1</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
